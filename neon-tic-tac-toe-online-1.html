<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#080b18">
<title>Neon Tic Tac Toe</title>
<style>
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
:root{--cyan:#36e7ff;--pink:#ff54c8;--bg:#080b18}
body{margin:0;min-height:100vh;padding:24px 14px;display:flex;justify-content:center;align-items:center;font-family:system-ui,-apple-system,sans-serif;color:#fff;background:radial-gradient(ellipse at top,#20245a 0%,transparent 55%),linear-gradient(145deg,#080b18,#10152b);overflow-x:hidden}
.app{width:100%;max-width:430px;text-align:center;animation:enter .7s ease both}
@keyframes enter{from{opacity:0;transform:translateY(20px) scale(.98)}to{opacity:1;transform:translateY(0) scale(1)}}
h1{margin:0;font-size:clamp(29px,8vw,42px);letter-spacing:1.5px;background:linear-gradient(90deg,var(--cyan),#fff,var(--pink));background-clip:text;-webkit-background-clip:text;color:transparent;filter:drop-shadow(0 0 14px #36e7ff44)}
.subtitle{color:#9ca9d0;font-size:12px;letter-spacing:3px;margin:7px 0 20px}
.panel{padding:19px 14px;border:1px solid #ffffff1b;border-radius:25px;background:linear-gradient(145deg,#171d37e8,#0d1225f5);box-shadow:0 20px 55px #0008,inset 0 1px #ffffff10;backdrop-filter:blur(15px)}
.scoreboard{display:flex;justify-content:center;gap:10px;margin-bottom:17px}
.score{flex:1;padding:10px 7px;border:1px solid #ffffff18;border-radius:15px;background:#ffffff06;transition:transform .25s,border-color .25s,box-shadow .25s}
.score.active{border-color:var(--cyan);box-shadow:0 0 20px #36e7ff25;transform:translateY(-2px)}
.score strong{display:block;font-size:26px}.score span{color:#aeb8d6;font-size:11px}
.x-color{color:var(--cyan)}.o-color{color:var(--pink)}
.status{min-height:28px;margin:14px 0 18px;font-size:16px;color:#e6eaff}
.board-wrap{position:relative;width:min(86vw,330px);aspect-ratio:1;margin:0 auto}
.board{width:100%;height:100%;display:grid;grid-template-columns:repeat(3,1fr);grid-template-rows:repeat(3,1fr);gap:9px}
.cell{min-width:0;border:1px solid #ffffff18;border-radius:17px;background:linear-gradient(145deg,#1a2140,#11162b);color:white;font-size:clamp(40px,13vw,61px);font-weight:800;cursor:pointer;box-shadow:0 6px 15px #0004,inset 0 1px #ffffff08;transition:transform .18s,background .2s,box-shadow .2s;touch-action:manipulation}
.cell:active{transform:scale(.88)}.cell:disabled{cursor:default}
.cell.x{color:var(--cyan);text-shadow:0 0 12px #36e7ff99}.cell.o{color:var(--pink);text-shadow:0 0 12px #ff54c899}
.cell.pop{animation:pop .35s cubic-bezier(.2,1.8,.5,1)}
@keyframes pop{0%{transform:scale(.45) rotate(-12deg)}70%{transform:scale(1.16) rotate(4deg)}100%{transform:scale(1) rotate(0)}}
.cell.winner{background:linear-gradient(145deg,#183f4b,#24204a);border-color:var(--cyan);animation:winnerGlow .8s ease-in-out infinite alternate}
@keyframes winnerGlow{from{box-shadow:0 0 8px #36e7ff33}to{box-shadow:0 0 25px #36e7ff99,inset 0 0 15px #36e7ff22}}
.win-line{position:absolute;inset:0;width:100%;height:100%;pointer-events:none;overflow:visible}
.win-line line{stroke:#fff;stroke-width:3.5;stroke-linecap:round;filter:drop-shadow(0 0 5px var(--cyan));stroke-dasharray:400;stroke-dashoffset:400;animation:drawLine .45s ease forwards}
@keyframes drawLine{to{stroke-dashoffset:0}}
.actions{display:flex;gap:8px;margin-top:21px}
button.action{flex:1;min-width:0;border:1px solid #ffffff25;border-radius:13px;padding:12px 6px;background:#ffffff0b;color:#fff;font-weight:700;font-size:13px;cursor:pointer;transition:transform .2s,background .2s}
button.action:active{transform:scale(.94)}
button.primary{border:none;color:#07101c;background:linear-gradient(100deg,var(--cyan),#a1f6ff);box-shadow:0 5px 20px #36e7ff30}
button.sound-off{color:#ffb0d9}
.footer{margin-top:17px;color:#737f9f;font-size:10px;letter-spacing:2px}
#effects{position:fixed;inset:0;pointer-events:none;overflow:hidden;z-index:10}
.confetti{position:absolute;top:-20px;width:8px;height:13px;border-radius:2px;animation:fall var(--duration) linear forwards}
@keyframes fall{to{transform:translate(var(--drift),110vh) rotate(900deg);opacity:0}}
@media(prefers-reduced-motion:reduce){*,*::before,*::after{animation-duration:.01ms!important;animation-iteration-count:1!important;scroll-behavior:auto!important}}
</style>
</head>
<body>
<div id="effects"></div>
<main class="app">
  <h1>NEON TIC TAC TOE</h1>
  <div class="subtitle">THE ULTIMATE DUEL</div>
  <section class="panel">
    <div class="scoreboard">
      <div class="score active" id="scoreX"><strong class="x-color">X</strong><span id="labelX">YOU</span><strong id="winsX">0</strong></div>
      <div class="score" id="scoreO"><strong class="o-color">O</strong><span id="labelO">SMART AI</span><strong id="winsO">0</strong></div>
    </div>
    <div class="status" id="status" aria-live="polite">Your turn — you are X</div>
    <div class="board-wrap">
      <div class="board" id="board">
        <button class="cell" data-i="0" aria-label="Cell 1"></button>
        <button class="cell" data-i="1" aria-label="Cell 2"></button>
        <button class="cell" data-i="2" aria-label="Cell 3"></button>
        <button class="cell" data-i="3" aria-label="Cell 4"></button>
        <button class="cell" data-i="4" aria-label="Cell 5"></button>
        <button class="cell" data-i="5" aria-label="Cell 6"></button>
        <button class="cell" data-i="6" aria-label="Cell 7"></button>
        <button class="cell" data-i="7" aria-label="Cell 8"></button>
        <button class="cell" data-i="8" aria-label="Cell 9"></button>
      </div>
      <svg class="win-line" id="winLine" viewBox="0 0 300 300" preserveAspectRatio="none" aria-hidden="true">
        <line id="line" x1="0" y1="0" x2="0" y2="0" visibility="hidden"/>
      </svg>
    </div>
    <div class="actions">
      <button class="action primary" id="restart">↻ Restart</button>
      <button class="action" id="mode">🤖 1 Player</button>
      <button class="action" id="sound">🔊 Sound ON</button>
    </div>
    <div class="actions">
      <button class="action primary" id="onlineBtn">🌐 Online Play</button>
    </div>
    <section id="onlinePanel" style="display:none;margin-top:14px;text-align:left;border:1px solid #ffffff22;border-radius:16px;padding:13px;background:#080b1888">
      <strong style="display:block;margin-bottom:10px">ONLINE DUEL</strong>
      <button class="action primary" id="createRoom" style="width:100%;padding:12px">＋ Create Room</button>
      <div style="display:flex;gap:8px;margin-top:9px">
        <input id="roomInput" maxlength="6" placeholder="ROOM CODE" autocomplete="off" style="min-width:0;flex:1;background:#11162b;border:1px solid #ffffff2a;border-radius:10px;color:white;padding:12px;text-transform:uppercase;font-weight:700;letter-spacing:2px">
        <button class="action" id="joinRoom">Join</button>
      </div>
      <div id="roomInfo" style="font-size:13px;color:#c5d1f5;margin-top:10px;overflow-wrap:anywhere">Create a room or enter your friend's code.</div>
      <button class="action" id="leaveRoom" style="width:100%;margin-top:9px;display:none">Leave Online Room</button>
    </section>
  </section>
  <div class="footer">BUILT FOR THE NEXT LEVEL</div>
</main>
<script type="module">
"use strict";
import { initializeApp } from "https://www.gstatic.com/firebasejs/13.1.0/firebase-app.js";
import { getAuth, signInAnonymously } from "https://www.gstatic.com/firebasejs/13.1.0/firebase-auth.js";
import { getDatabase, ref, get, set, update, onValue, runTransaction, remove } from "https://www.gstatic.com/firebasejs/13.1.0/firebase-database.js";

const firebaseConfig = {
  apiKey: "AIzaSyA4UcfcdotcI2EY0iL6Yab5H3JuYFgQyCc",
  authDomain: "neon-tic-tak-toe-game.firebaseapp.com",
  databaseURL: "https://neon-tic-tak-toe-game-default-rtdb.asia-southeast1.firebasedatabase.app",
  projectId: "neon-tic-tak-toe-game",
  storageBucket: "neon-tic-tak-toe-game.firebasestorage.app",
  messagingSenderId: "907824381423",
  appId: "1:907824381423:web:3939eb791201e9c4c64a1a",
  measurementId: "G-8Y5TFVLCJS"
};
const app = initializeApp(firebaseConfig);
const auth = getAuth(app);
const db = getDatabase(app);

const cells = [...document.querySelectorAll(".cell")];
const statusText = document.getElementById("status");
const scoreX = document.getElementById("scoreX");
const scoreO = document.getElementById("scoreO");
const winsX = document.getElementById("winsX");
const winsO = document.getElementById("winsO");
const labelX = document.getElementById("labelX");
const labelO = document.getElementById("labelO");
const soundButton = document.getElementById("sound");
const modeButton = document.getElementById("mode");
const line = document.getElementById("line");
const effects = document.getElementById("effects");
const onlineBtn = document.getElementById("onlineBtn");
const onlinePanel = document.getElementById("onlinePanel");
const createRoomBtn = document.getElementById("createRoom");
const joinRoomBtn = document.getElementById("joinRoom");
const roomInput = document.getElementById("roomInput");
const roomInfo = document.getElementById("roomInfo");
const leaveRoomBtn = document.getElementById("leaveRoom");
const combos = [[0,1,2],[3,4,5],[6,7,8],[0,3,6],[1,4,7],[2,5,8],[0,4,8],[2,4,6]];
const moveOrder = [4,0,2,6,8,1,3,5,7];

let board = Array(9).fill("");
let current = "X", gameOver = false, vsComputer = true, soundOn = true;
let score = {X:0,O:0}, audioContext = null, roundId = 0;
let online = false, roomCode = "", myPlayer = "", roomUnsubscribe = null, busy = false;

signInAnonymously(auth).catch(err => {
  console.error(err);
  roomInfo.textContent = "Firebase sign-in failed. Check Authentication > Sign-in method > Anonymous.";
});

function playTone(freq,duration=0.12,type="sine",volume=0.07) {
  if (!soundOn) return;
  try {
    const AC = window.AudioContext || window.webkitAudioContext;
    if (!AC) return;
    if (!audioContext) audioContext = new AC();
    if (audioContext.state === "suspended") audioContext.resume();
    const osc = audioContext.createOscillator(), gain = audioContext.createGain();
    osc.type=type; osc.frequency.setValueAtTime(freq,audioContext.currentTime);
    gain.gain.setValueAtTime(volume,audioContext.currentTime);
    gain.gain.exponentialRampToValueAtTime(0.001,audioContext.currentTime+duration);
    osc.connect(gain); gain.connect(audioContext.destination); osc.start(); osc.stop(audioContext.currentTime+duration);
  } catch(e) {}
}
function moveSound(p){playTone(p==="X"?520:360,0.13,"sine")}
function victorySound(){[523,659,784,1046].forEach((f,i)=>setTimeout(()=>playTone(f,0.24,"triangle",0.09),i*130))}
function drawSound(){playTone(260,0.2,"triangle");setTimeout(()=>playTone(220,0.25,"triangle"),170)}
function vibrate(p){if("vibrate" in navigator) navigator.vibrate(p)}
function updateTurn(){
  scoreX.classList.toggle("active",current==="X"&&!gameOver);
  scoreO.classList.toggle("active",current==="O"&&!gameOver);
}
function findWinner(b){
  for(const combo of combos){const [a,c,d]=combo;if(b[a]&&b[a]===b[c]&&b[a]===b[d])return {player:b[a],combo}}
  return null;
}
function drawWinningLine(combo){
  const pts={0:[50,50],1:[150,50],2:[250,50],3:[50,150],4:[150,150],5:[250,150],6:[50,250],7:[150,250],8:[250,250]};
  const a=pts[combo[0]],b=pts[combo[2]];
  line.setAttribute("x1",a[0]);line.setAttribute("y1",a[1]);line.setAttribute("x2",b[0]);line.setAttribute("y2",b[1]);line.setAttribute("visibility","visible");
  line.style.animation="none";void line.getBoundingClientRect();line.style.animation="";
}
function celebrate(){
  const colors=["#36e7ff","#ff54c8","#fff176","#a78bfa","#ffffff"];
  for(let i=0;i<90;i++){const p=document.createElement("span");p.className="confetti";p.style.left=Math.random()*100+"vw";p.style.background=colors[i%colors.length];p.style.setProperty("--drift",(Math.random()*220-110)+"px");p.style.setProperty("--duration",(2+Math.random()*2)+"s");p.style.animationDelay=Math.random()*0.5+"s";effects.appendChild(p);setTimeout(()=>p.remove(),5000)}
}
function finishGame(winner,combo){
  gameOver=true;
  if(winner){combo.forEach(i=>cells[i].classList.add("winner"));statusText.textContent=online?("🏆 Player "+winner+" WINS!"):vsComputer?(winner==="X"?"🎉 You WIN!":"🤖 Computer WINS!"):"🏆 Player "+winner+" WINS!";
    if(!online){score[winner]++;winsX.textContent=score.X;winsO.textContent=score.O}
    drawWinningLine(combo);victorySound();celebrate();vibrate([80,50,120]);
  }else{statusText.textContent="🤝 It's a DRAW!";drawSound();vibrate([40,40,40])}
  updateTurn();
}
function paintBoard(){
  cells.forEach((c,i)=>{const v=board[i]||"";c.textContent=v;c.disabled=!!v||gameOver||(online&&current!==myPlayer)||(!online&&vsComputer&&current!=="X");c.className="cell"+(v?" "+v.toLowerCase():"");if(v)c.setAttribute("aria-label","Cell "+(i+1)+": "+v);else c.setAttribute("aria-label","Cell "+(i+1))});
  line.setAttribute("visibility","hidden");
  const win=findWinner(board);if(win){win.combo.forEach(i=>cells[i].classList.add("winner"));drawWinningLine(win.combo)}
  if(win||board.every(Boolean)){gameOver=true;statusText.textContent=win?("🏆 Player "+win.player+" WINS!"):"🤝 It's a DRAW!"}
  else statusText.textContent=online?("Room "+roomCode+" · You are "+myPlayer+" · "+(current===myPlayer?"Your turn":"Opponent's turn")):vsComputer?(current==="X"?"Your turn — you are X":"🤖 Computer is thinking..."):"Player "+current+"'s turn";
  updateTurn();
}
function renderMove(i,p){board[i]=p;cells[i].textContent=p;cells[i].className="cell "+p.toLowerCase()+" pop";moveSound(p);vibrate(20)}
function takeLocalTurn(i){
  renderMove(i,current);const res=findWinner(board);if(res){finishGame(res.player,res.combo);return true}
  if(board.every(Boolean)){finishGame(null,[]);return true}
  current=current==="X"?"O":"X";paintBoard();return false;
}
function minimax(b,maximizing,depth){
  const r=findWinner(b);if(r)return r.player==="O"?10-depth:depth-10;if(b.every(Boolean))return 0;
  let best=maximizing?-Infinity:Infinity;
  for(const i of moveOrder){if(b[i])continue;b[i]=maximizing?"O":"X";const val=minimax(b,!maximizing,depth+1);b[i]="";best=maximizing?Math.max(best,val):Math.min(best,val)}
  return best;
}
function getBestComputerMove(){let best=-Infinity,move=-1;for(const i of moveOrder){if(board[i])continue;board[i]="O";const v=minimax(board,false,0);board[i]="";if(v>best){best=v;move=i}}return move}
function computerTurn(){if(gameOver||!vsComputer||current!=="O")return;const id=roundId;setTimeout(()=>{if(id!==roundId||gameOver||!vsComputer||current!=="O")return;const m=getBestComputerMove();if(m!==-1)takeLocalTurn(m)},400)}
async function handleMove(i){
  if(gameOver||board[i]||busy)return;
  if(online){
    if(current!==myPlayer||!roomCode)return;
    busy=true;
    try{
      const r=ref(db,"rooms/"+roomCode);
      const result=await runTransaction(r,old=>{
        if(!old||old.status!=="playing"||old.current!==myPlayer||old.board[i])return;
        const b=old.board.slice();b[i]=myPlayer;const win=findWinner(b);
        return {...old,board:b,current:myPlayer==="X"?"O":"X",status:(win||b.every(Boolean))?"finished":"playing",winner:win?win.player:(b.every(Boolean)?"draw":null),updatedAt:Date.now()};
      });
      if(!result.committed)roomInfo.textContent="Move not accepted. Wait for your turn or reconnect.";
    }catch(e){roomInfo.textContent="Move failed: "+e.message}
    finally{busy=false}
    return;
  }
  if(vsComputer&&current!=="X")return;
  const ended=takeLocalTurn(i);if(!ended&&vsComputer&&current==="O")computerTurn();
}
function resetBoard(){
  roundId++;board=Array(9).fill("");current="X";gameOver=false;
  cells.forEach(c=>{c.textContent="";c.disabled=false;c.className="cell"});
  line.setAttribute("visibility","hidden");effects.replaceChildren();paintBoard();
}
function randomCode(){const chars="ABCDEFGHJKLMNPQRSTUVWXYZ23456789";let out="";for(let i=0;i<6;i++)out+=chars[Math.floor(Math.random()*chars.length)];return out}
function listenRoom(code){
  if(roomUnsubscribe)roomUnsubscribe();
  roomCode=code;online=true;vsComputer=false;modeButton.disabled=true;modeButton.style.opacity=".5";
  roomUnsubscribe=onValue(ref(db,"rooms/"+code),snap=>{
    if(!snap.exists()){roomInfo.textContent="Room no longer exists.";return}
    const r=snap.val();board=Array.isArray(r.board)?r.board:Array(9).fill("");current=r.current||"X";gameOver=r.status==="finished";
    roomInfo.textContent="Room code: "+code+" · Share this code with your friend. "+(r.players&&r.players.O?"Both players connected.":"Waiting for second player...");
    leaveRoomBtn.style.display="block";
    paintBoard();
    if(r.winner&&r.winner!=="draw") {const w=findWinner(board);if(w){w.combo.forEach(i=>cells[i].classList.add("winner"));drawWinningLine(w.combo)}}
  },err=>{roomInfo.textContent="Could not read room: "+err.message});
}
async function createRoom(){
  if(!auth.currentUser){roomInfo.textContent="Signing in... try again in a moment.";return}
  roomInfo.textContent="Creating room...";
  try{
    let code="",made=false;
    for(let tries=0;tries<5&&!made;tries++){code=randomCode();const r=ref(db,"rooms/"+code);const res=await runTransaction(r,old=>old===null?{board:Array(9).fill(""),current:"X",status:"playing",winner:null,players:{X:auth.currentUser.uid,O:null},createdAt:Date.now()}:undefined);made=res.committed}
    if(!made)throw new Error("Could not reserve a room code. Try again.");
    myPlayer="X";roomInput.value=code;listenRoom(code);
  }catch(e){roomInfo.textContent="Create failed: "+e.message+" Check your database Rules."}
}
async function joinRoom(){
  if(!auth.currentUser){roomInfo.textContent="Signing in... try again in a moment.";return}
  const code=roomInput.value.trim().toUpperCase();
  if(!/^[A-HJ-NP-Z2-9]{6}$/.test(code)){roomInfo.textContent="Enter a valid 6-character room code.";return}
  try{
    const r=ref(db,"rooms/"+code);
    const result=await runTransaction(r,old=>{
      if(!old||old.status!=="playing"||old.players?.X===auth.currentUser.uid||old.players?.O)return;
      return {...old,players:{...old.players,O:auth.currentUser.uid}};
    });
    if(!result.committed){roomInfo.textContent="Room not found, already full, or game has ended.";return}
    myPlayer="O";listenRoom(code);
  }catch(e){roomInfo.textContent="Join failed: "+e.message+" Check your database Rules."}
}
async function leaveRoom(){
  if(roomUnsubscribe){roomUnsubscribe();roomUnsubscribe=null}
  if(roomCode&&myPlayer==="X"){try{await remove(ref(db,"rooms/"+roomCode))}catch(e){}}
  online=false;roomCode="";myPlayer="";busy=false;modeButton.disabled=false;modeButton.style.opacity="1";roomInfo.textContent="Create a room or enter your friend's code.";leaveRoomBtn.style.display="none";resetBoard();
}
cells.forEach(c=>c.addEventListener("click",()=>handleMove(Number(c.dataset.i))));
document.getElementById("restart").addEventListener("click",async()=>{
  if(online&&roomCode&&myPlayer==="X"){try{await update(ref(db,"rooms/"+roomCode),{board:Array(9).fill(""),current:"X",status:"playing",winner:null,updatedAt:Date.now()})}catch(e){roomInfo.textContent="Restart failed: "+e.message}}
  else if(!online)resetBoard();
  playTone(660,0.1);
});
modeButton.addEventListener("click",()=>{if(online)return;vsComputer=!vsComputer;modeButton.textContent=vsComputer?"🤖 1 Player":"👥 2 Players";labelX.textContent=vsComputer?"YOU":"PLAYER X";labelO.textContent=vsComputer?"SMART AI":"PLAYER O";resetBoard()});
soundButton.addEventListener("click",()=>{soundOn=!soundOn;soundButton.textContent=soundOn?"🔊 Sound ON":"🔇 Sound OFF";soundButton.classList.toggle("sound-off",!soundOn);if(soundOn)playTone(660,0.12)});
onlineBtn.addEventListener("click",()=>{onlinePanel.style.display=onlinePanel.style.display==="none"?"block":"none"});
createRoomBtn.addEventListener("click",createRoom);
joinRoomBtn.addEventListener("click",joinRoom);
leaveRoomBtn.addEventListener("click",leaveRoom);
resetBoard();
</script>
</body>
</html>
